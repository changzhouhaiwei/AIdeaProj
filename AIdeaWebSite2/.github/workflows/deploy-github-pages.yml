# 在仓库根目录推送 main/master 时，构建 AIdeaWebSite2/Site 并发布到 GitHub Pages
name: Deploy AIdeaWebSite2 Site to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'AIdeaWebSite2/Site/**'
      - 'AIdeaWebSite2/.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-aideawebsite2-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AIdeaWebSite2/Site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: AIdeaWebSite2/Site/package-lock.json

      - name: Set VITE_BASE for GitHub Pages
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO_NAME" = "${OWNER}.github.io" ]; then
            echo "VITE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE=/${REPO_NAME}/" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Fetch RSS into public/daily.json
        run: npm run fetch:daily

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: AIdeaWebSite2/Site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
