pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

include ':launcher', ':unityLibrary'


dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        // 新 SDK（如 Bigo 5.9.x）镜像可能未同步 AAR，优先走官方源
        google()
        mavenCentral()

        maven { url 'https://maven.aliyun.com/repository/public' }
        // GameSDK 私有仓库。账号密码放本机环境变量，不要写进工程。
        // ZZXZ_MAVEN_USER / ZZXZ_MAVEN_PASSWORD
        def zzxzUser = System.getenv('ZZXZ_MAVEN_USER')
        def zzxzPassword = System.getenv('ZZXZ_MAVEN_PASSWORD')
        if (zzxzUser && zzxzPassword) {
            maven {
                credentials {
                    username zzxzUser
                    password zzxzPassword
                }
                url 'https://packages.aliyun.com/maven/repository/2098332-release-EeT20f'
            }
        }
        maven { url 'https://artifact.bytedance.com/repository/pangle/' }
        maven { url 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea' }
        maven { url 'https://artifactory.bidmachine.io/bidmachine' } // BidMachine
        flatDir {
            dirs "${project(':unityLibrary').projectDir}/libs"
        }
    }
}
