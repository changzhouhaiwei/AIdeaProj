# 推送到默认分支后自动构建并发布到 GitHub Pages（仓库 → Settings → Pages → Source 选 GitHub Actions）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve site URL and base path for GitHub Pages
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          SITE="https://${OWNER}.github.io"
          if [ "$REPO_NAME" = "${OWNER}.github.io" ]; then
            echo "PUBLIC_ASTRO_SITE=${SITE}/" >> "$GITHUB_ENV"
            echo "PUBLIC_ASTRO_BASE=/" >> "$GITHUB_ENV"
          else
            echo "PUBLIC_ASTRO_SITE=${SITE}/${REPO_NAME}/" >> "$GITHUB_ENV"
            echo "PUBLIC_ASTRO_BASE=/${REPO_NAME}/" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
